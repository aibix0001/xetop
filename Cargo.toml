[package]
name = "xetop"
version = "0.1.0"
edition = "2024"
description = "Terminal-based real-time monitor for Intel Lunar Lake Xe GPU and NPU"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
log = "0.4"
nix = { version = "0.29", features = ["fs"] }
ratatui = "0.30"
simplelog = "0.12"

[profile.release]
lto = true
strip = true
codegen-units = 1
